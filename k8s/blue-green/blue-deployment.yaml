apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    app: aceest-fitness
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      version: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: blue
    spec:
      containers:
        - name: aceest-fitness
          image: deenbenny/aceest-fitness:v3.2.5
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v3.2.5"
